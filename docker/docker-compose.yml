services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: copa_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: copa_challenger
      MYSQL_USER: dbt_user
      MYSQL_PASSWORD: dbt_password_123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # init-scripts fica em database/, na raiz do repo (um nível acima deste arquivo)
      - ../database/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - copa_network

  # dbt Container
  dbt:
    build:
      # contexto = raiz do repositório (um nível acima deste arquivo)
      # necessário para o Dockerfile conseguir copiar o requirements.txt
      context: ..
      dockerfile: docker/Dockerfile
    container_name: copa_dbt
    working_dir: /workspace/dbt
    volumes:
      # monta a raiz do repositório, permitindo acesso a ml/, scripts/, dashboard/, etc
      - ../:/workspace
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=copa_challenger
      - DB_USER=dbt_user
      - DB_PASSWORD=dbt_password_123
      - DBT_PROFILES_DIR=/workspace/dbt
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - copa_network
    command: /bin/bash
    tty: true

  # Streamlit Dashboard (reaproveita a mesma imagem do dbt, que já
  # instala requirements.txt inteiro - streamlit/plotly/pandas incluídos)
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: copa_dashboard
    working_dir: /workspace
    volumes:
      - ../dashboard:/workspace/dashboard
    environment:
      # Porta 3306: comunicação interna entre containers usa a porta
      # real do MySQL dentro da rede Docker. O 3307 é só o mapeamento
      # externo (host -> container), usado pra evitar conflito com
      # outro MySQL já rodando na 3306 do seu host - não afeta a
      # comunicação interna entre containers.
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=copa_challenger
      - DB_USER=dbt_user
      - DB_PASSWORD=dbt_password_123
    ports:
      - "8501:8501"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - copa_network
    command: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501

volumes:
  mysql_data:

networks:
  copa_network:
    driver: bridge